[project]
name = "mfg-agent-backend"
version = "0.2.0"
description = "Manufacturing multi-agent platform backend (cloud embedding, no local reranker)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-chroma>=0.2.0",
    "chromadb>=1.0.0",
    "httpx>=0.27.0",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pyyaml>=6.0",
    "sqlglot>=30.23.0",
    "redis>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mfg_agents"]

[dependency-groups]
dev = [
    "playwright>=1.44.0",
    "pytest>=8.0.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
