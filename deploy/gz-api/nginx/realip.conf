# =============================================================================
# 真实客户端 IP（CDN 回源）
#
# 腾讯云 CDN 回源时会把客户端 IP 写入 X-Forwarded-For，来源地址是 CDN 回源 IP 段。
# 只有来自这些网段的请求才允许改写 $remote_addr，否则任何人都能伪造 XFF。
#
# 获取方式（任选其一，随腾讯云更新而变，不要凭记忆手写）：
#   - 控制台：CDN → 域名管理 → 选中加速域名 → 回源配置 → 回源 IP 段
#   - API：DescribeCdnOriginIpInfo / DescribeCdnIp（返回回源 IP 段）
#
# 拿到后逐行取消注释并填入本文件，然后：
#   docker compose up -d --no-build nginx
#
# 未填写任何 set_real_ip_from 时，nginx 不会改写 $remote_addr（安全默认），
# 日志里看到的是 CDN 节点 IP——日志排障时先回来补这段。
# =============================================================================

# set_real_ip_from 1.2.3.0/24;
# set_real_ip_from 1.2.4.0/24;

real_ip_header X-Forwarded-For;
real_ip_recursive on;
