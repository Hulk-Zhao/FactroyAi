upstream gz_backend {
    server 129.204.108.45:8004;
    keepalive 32;
}

server {
    listen 80;
    server_name hulkai.cn www.hulkai.cn;

    # Let's Encrypt webroot 校验：必须在 301 之前命中
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hulkai.cn www.hulkai.cn;

    ssl_certificate     /etc/letsencrypt/live/hulkai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hulkai.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # index.html 不缓存；带 ?v= 的静态资源长缓存
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 各项目前端：/demo/mfg/ → projects/mfg-agent/web/
    # ^~ 让该前缀优先于下面的静态资源正则，避免被 30d 缓存规则截走
    location = /demo/mfg {
        return 301 /demo/mfg/;
    }
    location ^~ /demo/mfg/ {
        alias /srv/projects/mfg-agent/web/;
        index index.html;
        # 不用 try_files：alias 下 $uri 仍是完整路径，会拼错目录
        add_header Cache-Control "no-cache";
    }

    # Hogo-QA-tool：/demo/hogo-qa/ → 香港本机 hogo-qa 容器（8788）
    # 容器按站点根路径托管产物（/assets/、/api/），所以这里用 rewrite 去掉前缀；
    # 页面内的绝对地址由前端构建基路径 /demo/hogo-qa/ 生成，浏览器侧仍带前缀。
    #
    # 用变量 + Docker 内置 DNS：nginx 启动时不再解析 hogo-qa，容器没起也能正常启动
    # （首次签发证书只起 nginx），容器重建换 IP 也能在 valid=10s 内自动跟上。
    location = /demo/hogo-qa {
        return 301 /demo/hogo-qa/;
    }
    location ^~ /demo/hogo-qa/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $hogo_upstream hogo-qa:8788;
        rewrite ^/demo/hogo-qa/(.*)$ /$1 break;
        proxy_pass http://$hogo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /api/ {
        proxy_pass http://gz_backend;
        proxy_http_version 1.1;
        # 用 upstream 的 host 作为 Host 头（$host 会把 hulkai.cn 传过去，
        # 后端/网关可能按域名拦截）；该改动来自线上 frontend 分支 ddf9860。
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE 关键三项：不缓冲，事件逐条下发
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 问数 90s / 事件流 90s，留足余量
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
