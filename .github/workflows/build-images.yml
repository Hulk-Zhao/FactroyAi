# =============================================================================
# 构建三个后端镜像，推送到 GHCR，并在配置了 TCR 凭据时同时推送腾讯云 TCR。
#
# 镜像命名（repo 路径全部小写）：
#   GHCR：ghcr.io/<owner>/<repo>-mfg-api:sha-<7>     + :latest
#         ghcr.io/<owner>/<repo>-aps-backend:sha-<7> + :latest
#         ghcr.io/<owner>/<repo>-hogo-qa:sha-<7>     + :latest
#   TCR ：ccr.ccs.tencentyun.com/hulkai/<repo>-mfg-api:sha-<7>     + :latest
#         ccr.ccs.tencentyun.com/hulkai/<repo>-aps-backend:sha-<7> + :latest
#         ccr.ccs.tencentyun.com/hulkai/<repo>-hogo-qa:sha-<7>     + :latest
#
# TCR 是可选通道（GHCR 在国内常拉不动）：
#   在仓库 Secrets 配置 TCR_USERNAME / TCR_PASSWORD（腾讯云 TCR 个人版访问凭证）。
#   两个 secret 都不存在时，所有 TCR 步骤自动跳过，只推 GHCR，workflow 不失败。
#
# 服务器只做 login / pull / up，不在 4C4G 机器上编译。
#
# 触发（workflow 级 paths）：
#   push 到 main 且改动命中以下路径才跑：
#     - projects/**                          三个镜像的构建上下文都在这里
#     - .github/workflows/build-images.yml   构建逻辑本身
#   纯文档改动（docs/、README、deploy/*.md 等）或 deploy/ 下与镜像无关的改动不触发。
#   workflow_dispatch 手动触发不受 paths 限制，永远全量构建三个镜像。
#
#   ⚠️ tag 是「本 workflow 实际运行的那次提交」，不是仓库 HEAD。只改 deploy/、docs/
#   的提交不会产出任何 tag，其 sha 在 GHCR 里查不到。部署文档引用 tag 时必须以
#   「最近一次触发构建的提交」为准，反查：
#     git log -1 --format=%h -- projects .github/workflows/build-images.yml
#
# 单镜像（job 级 if，由 prepare 里 git diff 的结果决定，不引入第三方 action）：
#   - projects/mfg-agent/api/**              → 只重建 mfg-api
#   - projects/smart-aps-agent/**            → 只重建 aps-backend
#   - projects/hogo-qa/**                    → 只重建 hogo-qa
#   - .github/workflows/build-images.yml     → 三个都重建
#   其余路径（例如 projects/ 之外、deploy/ 运行配置）不触发任何镜像构建。
#
# 未重建的镜像不重新编译：用 docker buildx imagetools 把当前 :latest 的 digest
# 补成同一个 sha tag。这样服务器仍然可以「一个 IMAGE_TAG 拉三个镜像」，
# 也保持「换 tag 整体回滚」的用法不变。
#
# 新增模块时需要同步改 4 处：
#   1) 顶部 on.push.paths：构建上下文若不在 projects/ 下，把那个目录加进去
#   2) prepare 的 Detect changed paths：加一条 case 分支（路径 → 新 job 的输出）
#   3) 新增一个 build job：复制现有 job，改 context / Dockerfile / 镜像名 / if
#   4) alias 与 summary：镜像列表各加一项，否则未重建时不会补 tag、汇总也不显示
#
# 所需凭据：GITHUB_TOKEN 自动提供（permissions.packages: write）；
#   TCR 可选，配了 TCR_USERNAME / TCR_PASSWORD 才会推。
# =============================================================================
name: build-images

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 变更检测：算出三个镜像各自是否需要重建。
  # workflow_dispatch、首次推送、强制推送（before 提交取不到）一律按全量处理。
  # ---------------------------------------------------------------------------
  prepare:
    name: 变更检测
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.meta.outputs.prefix }}
      tcr_prefix: ${{ steps.meta.outputs.tcr_prefix }}
      tag: ${{ steps.meta.outputs.tag }}
      mfg: ${{ steps.changes.outputs.mfg }}
      aps: ${{ steps.changes.outputs.aps }}
      hogo: ${{ steps.changes.outputs.hogo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 要对比 push 前后的差异，浅克隆拿不到 before 提交
          fetch-depth: 0

      - name: Compute image prefix and tag
        id: meta
        run: |
          # GHCR 镜像路径必须全小写；GITHUB_REPOSITORY 保留大小写（如 Hulk-Zhao/FactroyAi），
          # 直接拼进镜像名会让 docker push 在客户端就报
          # invalid reference format: repository name (...) must be lowercase。
          # 这里显式转换并断言，不依赖 GitHub 或 Docker 的自动规范化。
          prefix="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          case "$prefix" in
            *[A-Z]*)
              echo "::error::镜像前缀仍含大写：$prefix"
              exit 1
              ;;
          esac
          # 注意：docker login -u 的用户名允许大写（账号名），只有镜像路径必须小写。
          # TCR 个人版：ccr.ccs.tencentyun.com / 命名空间 hulkai / 仓库 <repo>-<服务名>
          tcr_prefix="ccr.ccs.tencentyun.com/hulkai/$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          tag="sha-$(git rev-parse --short=7 HEAD)"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "tcr_prefix=$tcr_prefix" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "镜像前缀：$prefix"
          echo "TCR 前缀：$tcr_prefix（未配 secret 时不推送）"
          echo "本次 tag：$tag"

      - name: Detect changed paths
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          all=false
          reason="按变更路径判断"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            all=true
            reason="手动触发，全量构建"
          elif [ -z "${BEFORE:-}" ] \
               || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            all=true
            reason="拿不到可对比的 before 提交（首次推送或强制推送），全量构建"
          fi

          mfg=false
          aps=false
          hogo=false

          if [ "$all" = true ]; then
            mfg=true
            aps=true
            hogo=true
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
            echo "本次改动文件（最多显示 50 条）："
            printf '%s\n' "$changed" | sed -n '1,50p'

            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                projects/mfg-agent/api/*)           mfg=true ;;
                projects/smart-aps-agent/*)         aps=true ;;
                projects/hogo-qa/*)                 hogo=true ;;
                .github/workflows/build-images.yml) mfg=true; aps=true; hogo=true ;;
              esac
            done <<< "$changed"
          fi

          {
            echo "mfg=$mfg"
            echo "aps=$aps"
            echo "hogo=$hogo"
          } >> "$GITHUB_OUTPUT"

          echo "判定：mfg-api=$mfg aps-backend=$aps hogo-qa=$hogo（$reason）"

  # ---------------------------------------------------------------------------
  # 三个镜像各自构建；只有 prepare 判定有变化时才会跑（job 级 if）。
  # ---------------------------------------------------------------------------
  mfg:
    name: build mfg-api
    needs: prepare
    if: needs.prepare.outputs.mfg == 'true'
    runs-on: ubuntu-latest
    env:
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Login TCR
        if: env.TCR_USERNAME != '' && env.TCR_PASSWORD != ''
        run: |
          echo "$TCR_PASSWORD" \
            | docker login ccr.ccs.tencentyun.com -u "$TCR_USERNAME" --password-stdin

      - name: Build and push mfg-api
        env:
          PREFIX: ${{ needs.prepare.outputs.prefix }}
          TCR_PREFIX: ${{ needs.prepare.outputs.tcr_prefix }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          tcr_tags=()
          if [ -n "${TCR_USERNAME:-}" ] && [ -n "${TCR_PASSWORD:-}" ]; then
            tcr_tags=(-t "$TCR_PREFIX-mfg-api:$TAG" -t "$TCR_PREFIX-mfg-api:latest")
          fi
          docker build \
            --build-arg PIP_INDEX_URL=${{ vars.PIP_INDEX_URL || 'https://mirrors.cloud.tencent.com/pypi/simple' }} \
            -t "$PREFIX-mfg-api:$TAG" \
            -t "$PREFIX-mfg-api:latest" \
            "${tcr_tags[@]}" \
            projects/mfg-agent/api
          docker push --all-tags "$PREFIX-mfg-api"
          if [ ${#tcr_tags[@]} -gt 0 ]; then
            docker push --all-tags "$TCR_PREFIX-mfg-api"
          else
            echo "::notice title=TCR 跳过::未配置 TCR_USERNAME / TCR_PASSWORD，本次只推 GHCR"
          fi

  aps:
    name: build aps-backend
    needs: prepare
    if: needs.prepare.outputs.aps == 'true'
    runs-on: ubuntu-latest
    env:
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Login TCR
        if: env.TCR_USERNAME != '' && env.TCR_PASSWORD != ''
        run: |
          echo "$TCR_PASSWORD" \
            | docker login ccr.ccs.tencentyun.com -u "$TCR_USERNAME" --password-stdin

      - name: Build and push aps-backend
        env:
          PREFIX: ${{ needs.prepare.outputs.prefix }}
          TCR_PREFIX: ${{ needs.prepare.outputs.tcr_prefix }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          tcr_tags=()
          if [ -n "${TCR_USERNAME:-}" ] && [ -n "${TCR_PASSWORD:-}" ]; then
            tcr_tags=(-t "$TCR_PREFIX-aps-backend:$TAG" -t "$TCR_PREFIX-aps-backend:latest")
          fi
          docker build \
            -f projects/smart-aps-agent/aps-admin/Dockerfile \
            --build-arg MAVEN_MIRROR_URL=${{ vars.APS_MAVEN_MIRROR_URL || 'https://maven.aliyun.com/repository/public' }} \
            -t "$PREFIX-aps-backend:$TAG" \
            -t "$PREFIX-aps-backend:latest" \
            "${tcr_tags[@]}" \
            projects/smart-aps-agent
          docker push --all-tags "$PREFIX-aps-backend"
          if [ ${#tcr_tags[@]} -gt 0 ]; then
            docker push --all-tags "$TCR_PREFIX-aps-backend"
          else
            echo "::notice title=TCR 跳过::未配置 TCR_USERNAME / TCR_PASSWORD，本次只推 GHCR"
          fi

  hogo:
    name: build hogo-qa
    needs: prepare
    if: needs.prepare.outputs.hogo == 'true'
    runs-on: ubuntu-latest
    env:
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Login TCR
        if: env.TCR_USERNAME != '' && env.TCR_PASSWORD != ''
        run: |
          echo "$TCR_PASSWORD" \
            | docker login ccr.ccs.tencentyun.com -u "$TCR_USERNAME" --password-stdin

      - name: Build and push hogo-qa
        env:
          PREFIX: ${{ needs.prepare.outputs.prefix }}
          TCR_PREFIX: ${{ needs.prepare.outputs.tcr_prefix }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          tcr_tags=()
          if [ -n "${TCR_USERNAME:-}" ] && [ -n "${TCR_PASSWORD:-}" ]; then
            tcr_tags=(-t "$TCR_PREFIX-hogo-qa:$TAG" -t "$TCR_PREFIX-hogo-qa:latest")
          fi
          docker build \
            --build-arg HOGO_BASE=/demo/hogo-qa/ \
            -t "$PREFIX-hogo-qa:$TAG" \
            -t "$PREFIX-hogo-qa:latest" \
            "${tcr_tags[@]}" \
            projects/hogo-qa
          docker push --all-tags "$PREFIX-hogo-qa"
          if [ ${#tcr_tags[@]} -gt 0 ]; then
            docker push --all-tags "$TCR_PREFIX-hogo-qa"
          else
            echo "::notice title=TCR 跳过::未配置 TCR_USERNAME / TCR_PASSWORD，本次只推 GHCR"
          fi

  # ---------------------------------------------------------------------------
  # 未重建的镜像：把当前 :latest 的 manifest 直接补成同一个 sha tag（不拉层、不重编译），
  # 保证服务器用单个 IMAGE_TAG 仍能拉到三个镜像。
  # :latest 不存在（例如首次发布只包含一个模块）时只告警，不阻断已成功的构建。
  # ---------------------------------------------------------------------------
  alias:
    name: 补齐未重建镜像的 tag
    needs: [prepare, mfg, aps, hogo]
    if: |
      always() && !cancelled()
      && needs.prepare.result == 'success'
      && needs.mfg.result != 'failure'
      && needs.aps.result != 'failure'
      && needs.hogo.result != 'failure'
    runs-on: ubuntu-latest
    env:
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
    steps:
      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Login TCR
        if: env.TCR_USERNAME != '' && env.TCR_PASSWORD != ''
        run: |
          echo "$TCR_PASSWORD" \
            | docker login ccr.ccs.tencentyun.com -u "$TCR_USERNAME" --password-stdin

      - name: Retag unchanged images
        env:
          PREFIX: ${{ needs.prepare.outputs.prefix }}
          TCR_PREFIX: ${{ needs.prepare.outputs.tcr_prefix }}
          TAG: ${{ needs.prepare.outputs.tag }}
          MFG_RESULT: ${{ needs.mfg.result }}
          APS_RESULT: ${{ needs.aps.result }}
          HOGO_RESULT: ${{ needs.hogo.result }}
        run: |
          set -u

          alias_one() {
            reg="$1"
            label="$2"
            svc="$3"
            result="$4"
            [ "$result" = "skipped" ] || return 0
            if docker buildx imagetools create \
                 -t "$reg-$svc:$TAG" "$reg-$svc:latest"; then
              echo "$label $svc：本次未重建，已把 :latest 的 digest 补成 :$TAG"
            else
              echo "::warning title=$label $svc 缺少 $TAG::$label 侧未重建，且该 registry 上没有可复用的 :latest，$TAG 缺失"
            fi
          }

          alias_one "$PREFIX" GHCR mfg-api     "$MFG_RESULT"
          alias_one "$PREFIX" GHCR aps-backend "$APS_RESULT"
          alias_one "$PREFIX" GHCR hogo-qa     "$HOGO_RESULT"

          if [ -n "${TCR_USERNAME:-}" ] && [ -n "${TCR_PASSWORD:-}" ]; then
            alias_one "$TCR_PREFIX" TCR mfg-api     "$MFG_RESULT"
            alias_one "$TCR_PREFIX" TCR aps-backend "$APS_RESULT"
            alias_one "$TCR_PREFIX" TCR hogo-qa     "$HOGO_RESULT"
          else
            echo "::warning title=TCR 跳过::未配置 TCR_USERNAME / TCR_PASSWORD，TCR 侧未补 :latest / :$TAG"
          fi

  # ---------------------------------------------------------------------------
  # 汇总：列出每个镜像本次是重建还是复用，并给服务器 .env 的两行配置。
  # ---------------------------------------------------------------------------
  summary:
    name: 汇总
    needs: [prepare, mfg, aps, hogo, alias]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        env:
          PREFIX: ${{ needs.prepare.outputs.prefix }}
          TCR_PREFIX: ${{ needs.prepare.outputs.tcr_prefix }}
          TAG: ${{ needs.prepare.outputs.tag }}
          MFG_RESULT: ${{ needs.mfg.result }}
          APS_RESULT: ${{ needs.aps.result }}
          HOGO_RESULT: ${{ needs.hogo.result }}
          EVENT: ${{ github.event_name }}
          TCR_CONFIGURED: ${{ secrets.TCR_USERNAME != '' && secrets.TCR_PASSWORD != '' }}
        run: |
          status() {
            case "$1" in
              success) echo "重建并推送" ;;
              skipped) echo "未变化，复用已有镜像" ;;
              *)       echo "失败（$1）" ;;
            esac
          }

          {
            echo "### 本次镜像"
            echo ""
            echo "触发方式：\`$EVENT\`，tag：\`$TAG\`"
            echo ""
            echo "| 镜像 | 状态 |"
            echo "| --- | --- |"
            echo "| \`$PREFIX-mfg-api\` | $(status "$MFG_RESULT") |"
            echo "| \`$PREFIX-aps-backend\` | $(status "$APS_RESULT") |"
            echo "| \`$PREFIX-hogo-qa\` | $(status "$HOGO_RESULT") |"
            echo ""
            echo "**GHCR（默认）** 服务器 .env 填："
            echo ""
            echo '```'
            echo "REGISTRY=$PREFIX"
            echo "IMAGE_TAG=$TAG"
            echo '```'
            echo ""
            echo "对应镜像：\`$PREFIX-mfg-api:$TAG\`、\`$PREFIX-aps-backend:$TAG\`、\`$PREFIX-hogo-qa:$TAG\`"
            echo ""
            echo "**TCR（GHCR 拉不动时切换，只改 REGISTRY）**"
            if [ "$TCR_CONFIGURED" = "true" ]; then
              echo ""
              echo '```'
              echo "REGISTRY=$TCR_PREFIX"
              echo "IMAGE_TAG=$TAG"
              echo '```'
              echo ""
              echo "对应镜像：\`$TCR_PREFIX-mfg-api:$TAG\`、\`$TCR_PREFIX-aps-backend:$TAG\`、\`$TCR_PREFIX-hogo-qa:$TAG\`"
            else
              echo ""
              echo "未配置 \`TCR_USERNAME\` / \`TCR_PASSWORD\`，本次未推送 TCR。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
